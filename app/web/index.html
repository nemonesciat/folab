<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FOLab</title>
<style>
  :root { --bg: #16130f; --panel: #211c16; --line: #3a3127; --text: #e8dcc4; --dim: #9d8f78; --amber: #e0a33a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, sans-serif; }
  #app { display: flex; height: 100%; }
  #side { width: 300px; flex: none; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); }
  #side h1 { margin: 0; padding: 12px 14px 8px; font-size: 16px; letter-spacing: .08em; color: var(--amber); }
  #filter { margin: 0 12px 8px; padding: 6px 8px; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; }
  #list { flex: 1; overflow-y: auto; }
  .row { padding: 5px 14px; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; }
  .row:hover { background: #2c251d; }
  .row.on { background: #3a2f20; color: var(--amber); }
  .row .n { color: var(--dim); font-variant-numeric: tabular-nums; }
  .row small { display: block; color: var(--dim); }
  #main { flex: 1; position: relative; min-width: 0; }
  #view { position: absolute; inset: 0; }
  #bar { position: absolute; left: 0; right: 0; top: 0; padding: 8px 12px; display: flex; gap: 14px; align-items: center;
         background: linear-gradient(#16130fdd, #16130f00); pointer-events: none; }
  #bar > * { pointer-events: auto; }
  #title { font-weight: 600; }
  #status { color: var(--dim); }
  #bar label { color: var(--dim); }
  #help { position: absolute; left: 12px; bottom: 10px; color: var(--dim); font-size: 12px; }
  #pick { position: absolute; right: 12px; bottom: 10px; color: var(--text); background: #211c16cc; padding: 6px 10px;
          border: 1px solid var(--line); border-radius: 4px; display: none; max-width: 60%; }
</style>
</head>
<body>
<div id="app">
  <div id="side">
    <h1>FOLAB</h1>
    <input id="filter" placeholder="Find an interior…">
    <div id="list"></div>
  </div>
  <div id="main">
    <div id="view"></div>
    <div id="bar"><span id="title">Pick an interior</span><span id="status"></span>
      <label><input type="checkbox" id="markers"> Markers</label></div>
    <div id="help">Drag to look · WASD to move · Q/E down/up · wheel to step · Shift faster · click a thing to name it</div>
    <div id="pick"></div>
  </div>
</div>
<script src="/web/vendor/three.min.js"></script>
<script src="/web/vendor/DDSLoader.js"></script>
<script src="/web/viewer.js"></script>
</body>
</html>
