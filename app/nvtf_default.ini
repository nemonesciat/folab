; NVTF.ini written by FOLab: NVTF's own settings (names and defaults from its source, github.com/carxt/New-Vegas-Tick-Fix),
; with its core fixes on and its experimental DirectX and miscellaneous hooks off.

[Main]
bGTCFix=1
bFastExit=1
bEnableThreadingTweaks=1
bModifyDirectXBehavior=0
bRedoHashtables=1
bMiscHooks=0

[GTC]
bFPSFix=1
bAlternateGTCFix=0
bRemoveGTCLimits=0

[FPSFix]
fMaxTimeLowerBoundary=0.016
bSpiderHandsFix=0
iMaxFPSTolerance=59
iMinFPSTolerance=20
bfMaxTime=1

[Hashtables]
bResizeHashtables=1

[ThreadingTweaks]
iReplaceTextureCreationLocks=1
iReplaceGeometryPrecacheLocks=1
bTweakMiscCriticalSections=0
bAddPauseToSpinLocks=0
bReplaceDeadlockCSWithWaitAndSleep=0

[DirectX]
bToggleTripleBuffering=0
bUseDefaultPoolForTextures=0
bAllowDirectXDebugging=0
bUseFlipModel=0

[Misc]
iPCBMode=0
